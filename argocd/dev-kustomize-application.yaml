apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-app-dev
  namespace: kube-system
spec:
  project: default
  source:
    repoURL:
    targetRevision: HEAD
    path: kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
