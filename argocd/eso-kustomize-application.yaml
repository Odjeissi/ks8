apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso
  namespace: kube-system
spec:
  project: default
  source:
    repoURL:
    targetRevision: HEAD
    path: kustomize/eso
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
