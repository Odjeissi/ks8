apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namePrefix: prod-
namespace: prod
labels:
  - pairs:
      app: my-app
    includeSelectors: true
    includeTemplates: true
images:
  - name: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/project/my-app
    newTag: a80b33af
patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: app-deployment
