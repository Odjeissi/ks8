apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

namespace: prod

labels:
  - pairs:
     app: cloud-app
    includeSelectors: false
    includeTemplates: false

patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: app-deployment
